plugins {
    id 'com.android.application'
}

android {
    namespace 'com.verity.realminecraft'
    compileSdk 35

    defaultConfig {
        applicationId 'com.verity.realminecraft'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-AR'
        }
        release {
            minifyEnabled false
        }
    }
}

configurations.configureEach {
    // Sceneform 1.23 brings Kotlin 1.6's split JDK jars; androidx also
    // brings the merged Kotlin stdlib. Exclude the legacy split jars.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.gorisse.thomas.sceneform:sceneform:1.23.0'
}
