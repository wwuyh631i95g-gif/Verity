plugins {
    id 'com.android.application'
}

android {
    namespace 'com.verity.realminecraft'
    compileSdk 35

    defaultConfig {
        applicationId 'com.verity.realminecraft'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-X8b'
        }
        release {
            minifyEnabled false
        }
    }
}
