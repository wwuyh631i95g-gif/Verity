name: Build Mobile Lab APKs
on:
  push:
    branches: [ main ]
    paths:
      - "MobileLab/**"
      - ".github/workflows/build-mobile-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build four Android apps
        working-directory: MobileLab
        run: gradle --no-daemon --stacktrace clean :sketch3d:assembleDebug :doodleboom:assembleDebug :sandlens:assembleDebug :notifydash:assembleDebug
      - name: Check APKs
        run: |
          set -e
          for apk in MobileLab/sketch3d/build/outputs/apk/debug/*.apk MobileLab/doodleboom/build/outputs/apk/debug/*.apk MobileLab/sandlens/build/outputs/apk/debug/*.apk MobileLab/notifydash/build/outputs/apk/debug/*.apk; do
            test -s "$apk"
            ls -lh "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Four-Android-Apps-APK
          path: |
            MobileLab/sketch3d/build/outputs/apk/debug/*.apk
            MobileLab/doodleboom/build/outputs/apk/debug/*.apk
            MobileLab/sandlens/build/outputs/apk/debug/*.apk
            MobileLab/notifydash/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
