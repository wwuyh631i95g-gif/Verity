name: Build MCPI Studio Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "MCPIStudio/**"
      - ".github/workflows/build-mcpi-studio.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Decode and unpack source project
        run: |
          base64 -d MCPIStudio/project.tar.xz.b64 > /tmp/mcpi-studio-project.tar.xz
          mkdir -p /tmp/mcpi-studio-source
          tar -xJf /tmp/mcpi-studio-project.tar.xz -C /tmp/mcpi-studio-source
      - name: Generate Gradle wrapper
        working-directory: /tmp/mcpi-studio-source/MCPIStudio
        run: gradle --no-daemon wrapper --gradle-version 8.10.2
      - name: Build APK
        working-directory: /tmp/mcpi-studio-source/MCPIStudio
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          APK="/tmp/mcpi-studio-source/MCPIStudio/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/mcpi-studio-badging.txt
          grep -q "package: name='com.mcpistudio.mobile'" /tmp/mcpi-studio-badging.txt
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MCPI-Studio-0.1.0-Android-APK
          path: /tmp/mcpi-studio-source/MCPIStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
