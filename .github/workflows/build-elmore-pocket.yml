name: Build Elmore Pocket APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ElmorePocket/**"
      - ".github/workflows/build-elmore-pocket.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35 SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build Elmore Pocket
        run: gradle -p ElmorePocket --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          APK="ElmorePocket/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Elmore-Pocket-Android-APK
          path: ElmorePocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
