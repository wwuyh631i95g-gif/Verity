name: Export Verity source for inspection
on:
  push:
    branches: [ main ]
    paths: [ ".github/workflows/export-verity-source.yml" ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract clean Verity source
        run: |
          unzip -q Verity-5.0.1-Minecraft-2D-Build-Fix.zip -d .
          zip -qr Verity-source-tree.zip Verity-main
      - uses: actions/upload-artifact@v4
        with:
          name: Verity-source-tree
          path: Verity-source-tree.zip
          retention-days: 3
