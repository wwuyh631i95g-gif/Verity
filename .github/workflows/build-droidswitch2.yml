name: Build DroidSwitch 2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "DroidSwitch2/**"
      - ".github/workflows/build-droidswitch2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Gradle wrapper
        working-directory: DroidSwitch2
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: DroidSwitch2
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidSwitch2-2.0.0-Android-APK
          path: DroidSwitch2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android 14 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            APK="DroidSwitch2/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.droidswitch2.mobile/.MainActivity
            sleep 5
            if ! adb shell pidof com.droidswitch2.mobile >/dev/null; then
              adb logcat -d -t 3000
              echo "DroidSwitch 2 exited after launch"
              exit 1
            fi
            adb logcat -d -t 3000 > /tmp/droidswitch2-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com.droidswitch2.mobile" /tmp/droidswitch2-logcat.txt; then
              cat /tmp/droidswitch2-logcat.txt
              exit 1
            fi
            echo "DroidSwitch 2 Android 14 launch smoke test passed"
