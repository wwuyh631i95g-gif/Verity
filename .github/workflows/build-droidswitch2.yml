name: Build DroidSwitch 2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "DroidSwitch2/**"
      - ".github/workflows/build-droidswitch2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: DroidSwitch2
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK output
        run: |
          APK="DroidSwitch2/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidSwitch2-2.0.0-Android-APK
          path: DroidSwitch2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
