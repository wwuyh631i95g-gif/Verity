name: Build Neon Coast Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "NeonCoast/**"
      - ".github/workflows/build-neon-coast.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle local Three.js engine
        run: |
          npm pack three@0.128.0
          mkdir -p /tmp/three NeonCoast/app/src/main/assets/vendor
          tar -xzf three-0.128.0.tgz -C /tmp/three
          cp /tmp/three/package/build/three.min.js NeonCoast/app/src/main/assets/vendor/three.min.js
          test -s NeonCoast/app/src/main/assets/vendor/three.min.js
          node --check NeonCoast/app/src/main/assets/game.js

      - name: Set up Gradle 8.7 and create wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        working-directory: NeonCoast
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: NeonCoast
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="NeonCoast/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='com.verity.neoncoast' versionCode='2' versionName='0.2.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Coast-0.2.0-Android-APK
          path: NeonCoast/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: neon-coast-v0.2.0
          name: Neon Coast 0.2.0 — Story Update
          body: |
            Neon Coast: Last Run — an original compact Android open-world story game.
            Includes two switchable protagonists, five cinematic dialogue missions, a police pursuit, local messages/phone UI, vehicle driving, traffic and pedestrians.
            Original characters and plot; not a GTA VI port and no Rockstar assets.
          files: NeonCoast/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Android 14 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -no-metrics
          script: |
            APK="NeonCoast/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.verity.neoncoast/.MainActivity
            sleep 12
            if ! adb shell pidof com.verity.neoncoast >/dev/null; then
              adb logcat -d -t 5000
              echo "Neon Coast exited after launch"
              exit 1
            fi
            adb logcat -d -t 5000 > /tmp/neoncoast-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com.verity.neoncoast" /tmp/neoncoast-logcat.txt; then
              cat /tmp/neoncoast-logcat.txt
              exit 1
            fi
            echo "Neon Coast Android 14 launch smoke test passed"

