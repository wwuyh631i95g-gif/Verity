name: Build Block Tetris APK (Android 8+)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "BlockTetris/**"
      - ".github/workflows/build-block-tetris.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle -p BlockTetris --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Block-Tetris-Android-8-APK
          path: BlockTetris/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
