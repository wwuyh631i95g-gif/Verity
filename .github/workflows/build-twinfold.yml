name: Build TwinFold Android 14 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "TwinFold/**"
      - ".github/workflows/build-twinfold.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Gradle wrapper
        working-directory: TwinFold
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: TwinFold
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="TwinFold/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwinFold-0.1.0-Android-14-APK
          path: TwinFold/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android 14 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            APK="TwinFold/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.twinfold.duolink/.MainActivity
            sleep 8
            if ! adb shell pidof com.twinfold.duolink >/dev/null; then
              adb logcat -d -t 4000
              echo "TwinFold exited after launch"
              exit 1
            fi
            adb logcat -d -t 4000 > /tmp/twinfold-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com.twinfold.duolink" /tmp/twinfold-logcat.txt; then
              cat /tmp/twinfold-logcat.txt
              exit 1
            fi
            echo "TwinFold Android 14 launch smoke test passed"
