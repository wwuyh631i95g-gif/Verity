name: Build TwinFold 0.2.0 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "TwinFold/**"
      - ".github/workflows/build-twinfold.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Gradle wrapper
        working-directory: TwinFold
        run: gradle wrapper --gradle-version 8.7

      - name: Build TwinFold APK
        working-directory: TwinFold
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK package and archive
        run: |
          APK="TwinFold/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='com.twinfold.duolink' versionCode='2' versionName='0.2.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinFold-0.2.0-Android-APK
          path: TwinFold/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
