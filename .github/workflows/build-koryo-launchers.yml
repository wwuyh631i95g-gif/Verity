name: Build Koryo Launchers APKs

on:
  push:
    branches: [ main ]
    paths:
      - "KoryoLaunchers/**"
      - ".github/workflows/build-koryo-launchers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build both launchers
        working-directory: KoryoLaunchers
        run: gradle --no-daemon --stacktrace clean :classic:assembleDebug :modern:assembleDebug

      - name: Verify and rename APKs
        run: |
          set -e
          mkdir -p dist
          cp KoryoLaunchers/classic/build/outputs/apk/debug/classic-debug.apk dist/Koryo-Classic-1.0.apk
          cp KoryoLaunchers/modern/build/outputs/apk/debug/modern-debug.apk dist/Koryo-Blue-1.0.apk
          test -s dist/Koryo-Classic-1.0.apk
          test -s dist/Koryo-Blue-1.0.apk
          ls -lh dist/*.apk

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: Koryo-Launchers-Android-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
