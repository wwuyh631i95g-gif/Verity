name: Build iOS 18 Simulator APK for Android 14

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-ios18-android14.yml"
      - "scripts/make_ios18_android14.py"
      - "scripts/verity55/VerityPhoneExperience.kt"
      - "scripts/ios18/**"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK API 34
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate clean standalone project
        run: |
          python3 -m py_compile scripts/make_ios18_android14.py
          python3 scripts/make_ios18_android14.py
          cd IOS18-Simulator
          gradle --no-daemon wrapper --gradle-version 8.10.2

      - name: Build APK
        working-directory: IOS18-Simulator
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Android 14 APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS-18-Simulator-Android-14-APK
          path: IOS18-Simulator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Smoke test on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          script: |
            APK="IOS18-Simulator/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.virtual.ios18.simulator/dev.ios18.simulator.IOS18Activity
            sleep 12
            if ! adb shell pidof com.virtual.ios18.simulator >/dev/null; then
              adb logcat -d -t 4000
              echo "iOS 18 Simulator process exited after launch"
              exit 1
            fi
            adb logcat -d -t 4000 > /tmp/ios18-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com.virtual.ios18.simulator" /tmp/ios18-logcat.txt; then
              cat /tmp/ios18-logcat.txt
              exit 1
            fi
            echo "Android 14 launch smoke test passed"

