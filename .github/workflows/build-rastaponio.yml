name: Build Rastaponio demo APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Rastaponio/**"
      - ".github/workflows/build-rastaponio.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: Rastaponio
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Verify APK output
        run: |
          APK="Rastaponio/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rastaponio-1.0-demo-Android-APK
          path: Rastaponio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
