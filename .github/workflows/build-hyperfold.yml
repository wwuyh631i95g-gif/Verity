name: Build HYPERFOLD Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Hyperfold/**"
      - ".github/workflows/build-hyperfold.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Use consistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp TwinFold/ci-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Create Gradle wrapper
        working-directory: Hyperfold
        run: gradle wrapper --gradle-version 8.7

      - name: Build HYPERFOLD
        working-directory: Hyperfold
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="Hyperfold/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='com.hyperfold.axis' versionCode='1' versionName='1.0.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hyperfold-1.0.0-Android-APK
          path: Hyperfold/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android 14 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Pixel 2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            APK="Hyperfold/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.hyperfold.axis/.MainActivity
            sleep 7
            if ! adb shell pidof com.hyperfold.axis >/dev/null; then
              adb logcat -d -t 4000
              echo "HYPERFOLD exited after launch"
              exit 1
            fi
            adb logcat -d -t 4000 > /tmp/hyperfold-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com.hyperfold.axis" /tmp/hyperfold-logcat.txt; then
              cat /tmp/hyperfold-logcat.txt
              exit 1
            fi
            echo "HYPERFOLD Android 14 launch smoke test passed"
