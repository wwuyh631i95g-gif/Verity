name: Build TaleBell 0.1.0 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "TaleBell/**"
      - ".github/workflows/build-tale-bell.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Gradle wrapper
        working-directory: TaleBell
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK
        working-directory: TaleBell
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="TaleBell/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='com.verity.talebell' versionCode='1' versionName='0.1.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaleBell-0.1.0-Android-APK
          path: TaleBell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android 14 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            APK="TaleBell/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.verity.talebell/.MainActivity
            sleep 8
            if ! adb shell pidof com.verity.talebell >/dev/null; then
              adb logcat -d -t 4000
              echo "TaleBell exited after launch"
              exit 1
            fi
            adb logcat -d -t 4000 > /tmp/talebell-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com.verity.talebell" /tmp/talebell-logcat.txt; then
              cat /tmp/talebell-logcat.txt
              exit 1
            fi
            echo "TaleBell Android 14 launch smoke test passed"
