name: Build Living Desk Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, living-desk-build ]
    paths:
      - "LivingDesk/**"
      - ".github/workflows/build-living-desk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p LivingDesk --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK package and archive
        run: |
          APK="LivingDesk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.verity.livingdesk' versionCode='1' versionName='1.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Android 14 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Pixel 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            APK="LivingDesk/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.verity.livingdesk/.MainActivity
            sleep 7
            adb logcat -d -t 5000 > /tmp/livingdesk-logcat.txt
            if ! adb shell pidof com.verity.livingdesk >/dev/null; then
              cat /tmp/livingdesk-logcat.txt
              echo "Living Desk process exited after launch"
              exit 1
            fi
            if grep -E "FATAL EXCEPTION|Process: com.verity.livingdesk" /tmp/livingdesk-logcat.txt; then
              cat /tmp/livingdesk-logcat.txt
              exit 1
            fi
            echo "Living Desk Android 14 launch smoke test passed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Living-Desk-1.0-Honor-X8b-Android-APK
          path: LivingDesk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
