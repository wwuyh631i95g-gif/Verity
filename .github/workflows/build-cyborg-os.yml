name: Build CYBORG VM APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "CyborgOS/**"
      - ".github/workflows/build-cyborg-os.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CYBORG VM source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create Gradle wrapper
        working-directory: CyborgOS
        run: gradle wrapper --gradle-version 8.7
      - name: Build debug APK
        working-directory: CyborgOS
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug
      - name: Verify APK and package metadata
        run: |
          set -euo pipefail
          APK="CyborgOS/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 8
      - name: Upload CYBORG VM APK
        uses: actions/upload-artifact@v4
        with:
          name: CYBORG-VM-1.2.0-Android-APK
          path: CyborgOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
