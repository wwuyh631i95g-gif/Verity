name: Build BearWorld 0.1.0 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "BearWorld/**"
      - ".github/workflows/build-bear-world.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Three.js GLB loader
        run: |
          npm pack three@0.128.0
          mkdir -p /tmp/three
          tar -xzf three-0.128.0.tgz -C /tmp/three
          mkdir -p BearWorld/app/src/main/assets/vendor
          cp /tmp/three/package/build/three.min.js BearWorld/app/src/main/assets/vendor/
          cp /tmp/three/package/examples/js/loaders/GLTFLoader.js BearWorld/app/src/main/assets/vendor/

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Gradle wrapper
        working-directory: BearWorld
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK
        working-directory: BearWorld
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="BearWorld/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='com.verity.bearworld' versionCode='1' versionName='0.1.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BearWorld-0.1.0-Android-APK
          path: BearWorld/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android 14 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            APK="BearWorld/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.verity.bearworld/.MainActivity
            sleep 8
            if ! adb shell pidof com.verity.bearworld >/dev/null; then
              adb logcat -d -t 4000
              echo "BearWorld exited after launch"
              exit 1
            fi
            adb logcat -d -t 4000 > /tmp/bearworld-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com.verity.bearworld" /tmp/bearworld-logcat.txt; then
              cat /tmp/bearworld-logcat.txt
              exit 1
            fi
            echo "BearWorld Android 14 launch smoke test passed"
