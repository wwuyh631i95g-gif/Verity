name: Publish Aether OS VM 4.0.0 APK

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/repackage-aether-vm-apk.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Extract APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download successful Aether OS VM 4.0.0 build
        uses: actions/download-artifact@v4
        with:
          name: Aether-OS-VM-Edition-4.0.0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43278901247
          path: /tmp/aether-vm-artifact

      - name: Extract and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find /tmp/aether-vm-artifact -type f -name 'Aether-OS-VM-4.0.0-ARM64.apk' -print -quit)"
          test -n "$APK_SOURCE"
          test -s "$APK_SOURCE"
          mkdir -p release
          cp "$APK_SOURCE" release/Aether-OS-VM-4.0.0-ARM64.apk
          sha256sum release/Aether-OS-VM-4.0.0-ARM64.apk | tee release/SHA256SUMS.txt
          test "$(stat -c %s release/Aether-OS-VM-4.0.0-ARM64.apk)" -gt 300000000
          file release/Aether-OS-VM-4.0.0-ARM64.apk
          ls -lh release/

      - name: Publish APK as a downloadable Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aether-os-vm-4.0.0
          name: Aether OS VM 4.0.0
          body: |
            Aether OS VM 4.0.0 for Android ARM64.

            Download the APK asset below. SHA256 checksum is included.
          files: |
            release/Aether-OS-VM-4.0.0-ARM64.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
