name: Build BlockWorld AR V4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-real-minecraft-ar.yml"
      - "RealMinecraftAR/**"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p RealMinecraftAR :app:assembleDebug

      - name: Package standalone source
        run: zip -qr /tmp/BlockWorld-AR-V4-Source.zip RealMinecraftAR -x "RealMinecraftAR/.gradle/*" "RealMinecraftAR/app/build/*"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-AR-v4-APK
          path: RealMinecraftAR/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-AR-v4-Source
          path: /tmp/BlockWorld-AR-V4-Source.zip
          if-no-files-found: error
          retention-days: 14
