name: Build Verity APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 37 preview platform
        run: |
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract Verity project and apply latest customization fixes
        run: |
          unzip -q Verity-5.0.1-Minecraft-2D-Build-Fix.zip -d .
          python3 scripts/apply_custom_updates.py
      - name: Patch compile errors in 5.0.1 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Verity-main/app/src/main/java/dev/veriti/app")
          main = root / "MainActivity.kt"
          source = main.read_text(encoding="utf-8")
          start = source.index("private fun VeritiApp(")
          marker = "    val state = vm.state"
          index = source.index(marker, start)
          source = source[:index] + "    val context = LocalContext.current" + chr(10) + source[index:]
          main.write_text(source, encoding="utf-8")
          service = root / "service/FloatingAssistantService.kt"
          code = service.read_text(encoding="utf-8")
          anti_count = code.count("antiAlias = true")
          if anti_count == 1:
              code = code.replace("antiAlias = true", "setAntiAlias(true)", 1)
          elif anti_count == 0 and code.count("isAntiAlias = true") == 1:
              pass  # Latest customization patch already uses RoundedBitmapDrawable's property.
          else:
              raise SystemExit(f"antiAlias compatibility point unexpected (plain={anti_count}, drawable={code.count('isAntiAlias = true')})")
          service.write_text(code, encoding="utf-8")
      - name: Build debug APK
        working-directory: Verity-main
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Verity-5.0.1-debug-APK
          path: Verity-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
