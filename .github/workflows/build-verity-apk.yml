name: Build Verity APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract Verity project
        run: unzip -q Verity-5.0.1-Minecraft-2D-Build-Fix.zip -d .
      - name: Patch compile errors in 5.0.1 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Verity-main/app/src/main/java/dev/veriti/app")
          main = root / "MainActivity.kt"
          source = main.read_text(encoding="utf-8")
          start = source.index("private fun VeritiApp(")
          marker = "    val state = vm.state"
          index = source.index(marker, start)
          source = source[:index] + "    val context = LocalContext.current" + chr(10) + source[index:]
          main.write_text(source, encoding="utf-8")
          service = root / "service/FloatingAssistantService.kt"
          code = service.read_text(encoding="utf-8")
          assert code.count("antiAlias = true") == 1, "antiAlias replacement point was not unique"
          service.write_text(code.replace("antiAlias = true", "setAntiAlias(true)", 1), encoding="utf-8")
      - name: Build debug APK
        working-directory: Verity-main
        run: |
          chmod +x ./gradlew
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Verity-5.0.1-debug-APK
          path: Verity-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
