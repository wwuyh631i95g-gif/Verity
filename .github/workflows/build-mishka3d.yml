name: Build Mishka 3D Android APK
on:
  push:
    branches: [ bear-adventure ]
    paths:
      - "MishkaLite/**"
      - ".github/workflows/build-mishka3d.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: bear-adventure
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle --no-daemon --stacktrace -p MishkaLite :app:assembleDebug
      - name: Verify and rename APK
        run: |
          APK="MishkaLite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          mkdir -p dist
          cp "$APK" dist/Mishka-Adventure-3D.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mishka-Adventure-3D-APK
          path: dist/Mishka-Adventure-3D.apk
          if-no-files-found: error
          retention-days: 30
