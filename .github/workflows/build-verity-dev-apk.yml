name: Build Verity Developer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-verity-dev-apk.yml"
      - "developer/DeveloperWorkbenchScreen.kt"
      - "scripts/prepare_dev_build.py"
      - "scripts/apply_custom_updates.py"
      - "scripts/apply_widget_v2.py"
      - "scripts/apply_life_v6.py"
      - "scripts/life_v6_bundle_*.txt"
      - "Verity-5.0.1-Minecraft-2D-Build-Fix.zip"
      - "scripts/verity52_payload*.b64"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record build run ID for artifact retrieval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dev-build-info
          printf '%s\n%s\n%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > /tmp/verity-dev-run.txt
          CONTENT="$(base64 -w0 /tmp/verity-dev-run.txt)"
          FILE_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/contents/dev-build-info/latest-run.txt" --jq .sha 2>/dev/null || true)"
          if [ -n "$FILE_SHA" ]; then
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/dev-build-info/latest-run.txt" -f message="Record Verity Developer build run" -f content="$CONTENT" -f sha="$FILE_SHA" -f branch="$GITHUB_REF_NAME" >/dev/null
          else
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/dev-build-info/latest-run.txt" -f message="Record Verity Developer build run" -f content="$CONTENT" -f branch="$GITHUB_REF_NAME" >/dev/null
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 37 preview platform
        run: |
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Verity 5.0.1 and prepare developer edition
        run: |
          unzip -q Verity-5.0.1-Minecraft-2D-Build-Fix.zip -d .
          python3 scripts/apply_custom_updates.py
          python3 scripts/prepare_dev_build.py

      - name: Install image processing helpers
        run: python3 -m pip install --user pillow numpy

      - name: Apply Verity Widget V2
        run: python3 scripts/apply_widget_v2.py

      - name: Apply Verity Life V6 systems
        run: python3 scripts/apply_life_v6.py
      - name: Apply Verity Life V7 integration and fixes
        run: |
          cat scripts/apply_life_v7.py.gz.b64.part0 scripts/apply_life_v7.py.gz.b64.part1 > /tmp/verity-life-v7.py.gz.b64
          base64 -d /tmp/verity-life-v7.py.gz.b64 | gzip -dc > scripts/apply_life_v7.py
          python3 -m py_compile scripts/apply_life_v7.py
          python3 scripts/apply_life_v7.py

      - name: Apply Verity 5.2.0 unified Studio, voice weather and skin animation
        run: |
          cat scripts/verity52_payload.b64 scripts/verity52_payload.part1.b64 scripts/verity52_payload.part2.b64 scripts/verity52_payload.part3.b64 > /tmp/verity52_payload.b64
          base64 -d /tmp/verity52_payload.b64 > /tmp/verity52_payload.gz
          printf '%s  %s\n' '510bd9cb1145b586462fc9ea7fbbf805687cf71ff16a0937d168e8f84d2bc3ef' '/tmp/verity52_payload.gz' | sha256sum -c -
          tar -xz --no-overwrite-dir --no-same-owner --no-same-permissions -f /tmp/verity52_payload.gz -C /tmp
          python3 -m py_compile /tmp/apply_verity_52.py
          python3 /tmp/apply_verity_52.py Verity-main
      - name: Build developer debug APK
        working-directory: Verity-main
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Export patched source for integration tests
        run: |
          zip -qr /tmp/Verity-prepared-source.zip Verity-main -x "Verity-main/.gradle/*" "Verity-main/app/build/*"
      - name: Upload patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Verity-5.2.0-prepared-source-Developer
          path: /tmp/Verity-prepared-source.zip
          if-no-files-found: error
          retention-days: 3
      - name: Upload Verity Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: Verity-5.2.0-Developer-APK
          path: Verity-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

